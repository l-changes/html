<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>20以内进位加法（凑十法）</title>
  <style>
    body {
      font-family: 'Comic Sans MS', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 40px auto;
      max-width: 900px;
      background-color: #f0f8ff;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #4a90e2;
    }

    .section {
      background-color: #fff;
      padding: 30px;
      margin-bottom: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    /* 凑十法网格样式 */
    .math-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 10px;
      justify-items: center;
    }

    /* 按钮区域 */
    .actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .btn-print {
      background-color: #4CAF50;
      color: white;
    }

    .btn-print:hover {
      background-color: #45a049;
    }

    .btn-regen {
      background-color: #2196F3;
      color: white;
    }

    .btn-regen:hover {
      background-color: #0b7dda;
    }

    /* 打印专用样式 */
    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }

      body {
        margin: 0;
        background-color: #fff;
        max-width: none;
      }

      .section {
        box-shadow: none;
        padding: 0;
        margin-bottom: 0;
      }

      .actions {
        display: none;
      }

      h1 {
        font-size: 24px;
        color: #000;
        margin-top: 0;
      }

      .math-grid {
        gap: 24px 0px; 
        grid-template-columns: repeat(4, 1fr);
      }
      
      svg {
        width: 170px;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <h1>📝 20以内进位加法（凑十法）练习</h1>

  <div class="actions">
    <button class="btn-regen" onclick="generateCouShi()">🔄 换一批题目</button>
    <button class="btn-print" onclick="window.print()">🖨️ 打印练习卷</button>
  </div>

  <div class="section">
    <div class="math-grid" id="math-container"></div>
  </div>

  <script>
    // 生成指定范围内的随机整数 [min, max]
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 生成凑十法练习题（无重复）
    function generateCouShi() {
      let container = document.getElementById('math-container');
      container.innerHTML = '';

      // 枚举所有不重复的进位加法组合 (a >= b, a+b > 10, a+b <= 18, 均在2-9范围)
      let pairs = [];
      for (let a = 2; a <= 9; a++) {
        for (let b = 2; b <= a; b++) {
          if (a + b > 10 && a + b <= 18) {
            pairs.push([a, b]);
          }
        }
      }

      // Fisher-Yates 洗牌算法随机打乱顺序
      for (let i = pairs.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
      }

      // 显示所有不重复题目（共20道，4列×5行）
      pairs.forEach(([a, b]) => {
        let svg = `
        <svg width="180" height="135" viewBox="0 0 180 135">
          <!-- 算式文本 -->
          <text x="25" y="45" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" font-weight="bold" fill="#2c3e8a">${a}</text>
          <text x="55" y="45" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" font-weight="bold" fill="#2c3e8a">+</text>
          <text x="85" y="45" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" font-weight="bold" fill="#2c3e8a">${b}</text>
          <text x="115" y="45" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" font-weight="bold" fill="#2c3e8a">=</text>

          <!-- 结果输入框 -->
          <rect x="132" y="16" width="40" height="34" fill="transparent" stroke="#333" stroke-width="1.5" rx="2"/>

          <!-- 倒V字拆分线 -->
          <line x1="85" y1="52" x2="65" y2="78" stroke="#e91e63" stroke-width="3"/>
          <line x1="85" y1="52" x2="105" y2="78" stroke="#e91e63" stroke-width="3"/>

          <!-- 拆分后的数字填空框 -->
          <rect x="52.5" y="78" width="25" height="25" fill="transparent" stroke="#333" stroke-width="1.5" rx="2"/>
          <rect x="92.5" y="78" width="25" height="25" fill="transparent" stroke="#333" stroke-width="1.5" rx="2"/>

          <!-- U型括号连线 (连接第一个加数和第一个拆分出来的数) -->
          <path d="M 25 55 L 25 110 L 65 110 L 65 103" fill="none" stroke="#e91e63" stroke-width="3"/>

          <!-- 底部凑成的10 -->
          <text x="45" y="128" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#e91e63">10</text>
        </svg>`;

        let div = document.createElement('div');
        div.innerHTML = svg.trim();
        container.appendChild(div.firstChild);
      });
    }

    // 页面加载完成时立刻生成
    window.onload = generateCouShi;
  </script>
</body>

</html>
