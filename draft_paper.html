<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>分区草稿纸</title>
<style>
  @page {
    size: A4;
    margin: 0;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 210mm;
    height: 297mm;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  .top-blank {
    height: 2cm;
    width: 100%;
  }
  .sections {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    padding: 0 8mm; /* 左右留一点边距，避免打印机裁切 */
  }
  .section {
    width: 50%;
    height: 25%;
    border-bottom: 1.5px dashed #999;
    border-right: 1.5px dashed #999;
    position: relative;
    box-sizing: border-box;
  }
  /* 每行右边一列不要右边框 */
  .section:nth-child(2n) {
    border-right: none;
  }
  /* 最后一行不要底边框 */
  .section:nth-last-child(-n+2) {
    border-bottom: none;
  }
  .section-number {
    position: absolute;
    top: 2mm;
    right: 2mm;
    font-size: 8pt;
    color: #bbb;
    font-family: Arial, sans-serif;
  }

  @media screen {
    body {
      margin: 20px auto;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }
  }

  .print-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 8px 16px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  @media print {
    .print-btn { display: none; }
  }
</style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">打印 / 保存为PDF</button>
  <div class="top-blank"></div>
  <div class="sections">
    <div class="section"><span class="section-number">1</span></div>
    <div class="section"><span class="section-number">2</span></div>
    <div class="section"><span class="section-number">3</span></div>
    <div class="section"><span class="section-number">4</span></div>
    <div class="section"><span class="section-number">5</span></div>
    <div class="section"><span class="section-number">6</span></div>
    <div class="section"><span class="section-number">7</span></div>
    <div class="section"><span class="section-number">8</span></div>
  </div>
</body>
</html>
